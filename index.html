S.pg.ca={tol:CALTOL};
P.calibration={title:'Calibration',sub:'QA · Evaluator consistency',filters:'',body(){
  const spec=w=>wspec('QA','Calibration',w);
  const ctrl=card('Tolerance',`<div class="row wrap"><span class="muted sm">Count an evaluation as aligned when it is within</span><div style="width:240px">${slider('catol',{min:1,max:8,step:.5,val:S.pg.ca.tol,fmt:v=>'±'+v+' pts',label:'Calibration tolerance'})}</div><span class="muted xs">Tolerance X is an open decision (#9). Try values to see who drifts.</span></div>`);
  const top=R('catop',()=>{
    const t=S.pg.ca.tol,al=EVALR.map(e=>({e,a:calAlign(e,t)})),out=al.filter(x=>x.a<85),m=avg(al.map(x=>x.a));
    return `<div class="g g4">${tile('M32')}<div class="tile ${m>=85?'good':'bad'}" ${A('go','metric/M33')}><h5>${ragDot(m>=85?'good':'bad')} Calibration alignment</h5><div class="v">${f1(m,0)}%</div><div class="muted xs">within ±${t} pts of master · target ${fmtT('M33')}</div></div>${stat('Evaluators outside tolerance',out.length,out.map(x=>x.e.n.split(' ')[0]).join(', ')||'None',{cls:out.length?'bad':'good'})}${stat('Latest session','Oct 8','20 items calibrated')}</div>`});
  const bars=card('Alignment by evaluator',R('cabars',()=>{const t=S.pg.ca.tol;return hbars(EVALR.map(e=>({k:e.n,v:calAlign(e,t),color:calAlign(e,t)>=85?'#2EA06F':'#EA6C8B',tip:`<b>${esc(e.n)}</b><br>${f1(calAlign(e,t),0)}% within ±${t} pts<br>Mean variance ${e.v} pts`,act:'caev',arg:e.n})),{max:100,target:85,fmt:v=>f1(v,0)+'%'})+`<div class="xs muted mt">Dark marker is the 85% alignment target. Click an evaluator to see their deviations.</div>`}),{info:spec('Calibration results')});
  const trend=card('Variance by session',lineChart({labels:CALSESS,h:260,yMin:0,yMax:6,yFmt:v=>f1(v),series:[{name:'Average variance (pts)',color:'#8E7CC3',data:CALTREND,area:true}],target:{v:tgt('M32'),label:'Target ≤ '+tgt('M32')+' pts',color:'#2EA06F'}}),{info:spec('Calibration results')});
  return `<div class="note">${ico('lock','sm')}<div>Evaluator-level results are sensitive and restricted to QA leads.</div></div>`+ctrl+top+`<div class="g g2">${bars}${trend}</div>`;
}};
ACT.catol=(v,el)=>{S.pg.ca.tol=+v;sliderLabel(el,'±'+v+' pts');refresh('catop');refresh('cabars')};
ACT.caev=n=>{const e=EVALR.find(x=>x.n===n),t=S.pg.ca.tol;
  drawer(e.n,`<div class="g g3"><div class="tile"><h5>Mean variance</h5><div class="v">${e.v} pts</div></div><div class="tile ${calAlign(e,t)>=85?'good':'bad'}"><h5>Alignment</h5><div class="v">${f1(calAlign(e,t),0)}%</div></div><div class="tile"><h5>Evaluations / wk</h5><div class="v">${e.done}</div></div></div>${card('Deviation from master score, by calibrated item',barChart({labels:e.d.map((_,i)=>String(i+1)),h:240,yTicks:6,yMax:Math.ceil(Math.max(...e.d.map(Math.abs)))+1,yFmt:v=>f1(v),groups:[{name:'Deviation',color:'#8E7CC3',colors:e.d.map(x=>Math.abs(x)>t?'#EA6C8B':'#8E7CC3'),data:e.d.map(Math.abs)}],tip:(g,i)=>`<b>Item ${i+1}</b><br>${e.d[i]>0?'+':''}${f1(e.d[i])} pts vs. master`})+`<div class="xs muted" style="text-align:center">Pink bars exceed ±${t} pts.</div>`)}${ask('Which evaluators are out of calibration?','Ask NextIQ')}`,{sub:e.role})};
/* ================= QA: Dispute & Closure ================= */
S.pg.ds={thr:10};
P.disputes={title:'Dispute & Closure',sub:'QA · Feedback and disputes',filters:'range',body(){
  const spec=w=>wspec('QA','Dispute and Closure',w);
  const fun=card('From evaluation to overturn',R('dsfun',()=>{
    const dis=EVALS.filter(e=>e.status==='Disputed').length-EVALS.filter(e=>e.status==='Disputed').length; // local actions are tracked via DSX
    const o=DSX.over,d=DISP.disp+DSX.new,ov=DISP.over+o;
    return funnel([{k:'Evaluated',v:DISP.eval,note:'last 30 days',color:'linear-gradient(90deg,#5B8BBF,#8EB4DA)'},{k:'Feedback delivered',v:DISP.fb+DSX.fb,note:f1((DISP.fb+DSX.fb)/DISP.eval*100)+'% closure (M36)',color:'linear-gradient(90deg,#68BFBF,#9ED6D6)'},{k:'Disputed',v:d,note:f1(d/DISP.eval*100)+'% dispute rate (M34)',color:'linear-gradient(90deg,#E0A63A,#F1CD7F)'},{k:'Overturned',v:ov,note:f1(ov/d*100)+'% of disputes',color:'linear-gradient(90deg,#EA6C8B,#F2A4B7)'}])}),{info:spec('Disputes and feedback delivery')});
  const age=card('Feedback backlog by age',`<div class="row wrap" style="margin:-4px 0 10px"><span class="muted sm">Alert when waiting longer than</span><div style="width:170px">${slider('dsthr',{min:2,max:14,val:S.pg.ds.thr,fmt:v=>v+' days',label:'Backlog alert threshold'})}</div></div>`+R('dsage',()=>{const t=S.pg.ds.thr,bk=[[0,182],[3,94],[6,52],[11,30]],tot=sum(AGING.map(a=>a[1]));
    const late=sum(bk.filter(b=>b[0]>=t).map(b=>b[1]));
    return `${late?`<div class="note bad" style="margin-bottom:10px">${ico('bolt','sm')}<div><b>${late} evaluations</b> have waited ${t}+ days for feedback.</div></div>`:`<div class="note good" style="margin-bottom:10px">${ico('check','sm')}<div>Nothing waiting beyond ${t} days.</div></div>`}`+barChart({labels:AGING.map(a=>a[0]),h:220,yTicks:4,groups:[{name:'Waiting',color:'#8E7CC3',colors:bk.map(b=>b[0]>=t?'#EA6C8B':'#8E7CC3'),data:AGING.map(a=>a[1])}],act:'seg',actArg:(g,i)=>({title:AGING[i][0]+' · awaiting feedback',key:'ag'+i,n:8,opts:{}}),tip:(g,i)=>`<b>${AGING[i][0]}</b><br>${AGING[i][1]} evaluations (${f1(AGING[i][1]/tot*100,0)}%)`})}),{info:spec('Disputes and feedback delivery')});
  const dl=card('Open disputes',R('dslist',()=>{const l=EVALS.filter(e=>e.status==='Disputed');return l.length?table([{h:'Evaluation'},{h:'Agent'},{h:'Score',cls:'r'},{h:'Reason'},{h:'Decision',cls:'r'}],l.map(e=>`<tr class="rc" ${A('eval',e.id)}><td class="tk">${e.id}</td><td>${esc(e.agent)}</td><td class="r">${f1(e.score)}</td><td class="muted sm">${esc(S.disputes[e.id]||'A question was scored incorrectly')}</td><td class="r nw"><button class="btn sm" ${A('dsres',e.id+'|up')}>Uphold</button> <button class="btn sm" ${A('dsres',e.id+'|over')}>Overturn</button></td></tr>`)):'<div class="empty">No open disputes. Nicely done.</div>'}),{cls:'flat',info:'Resolving a dispute updates the funnel above.'});
  return `<div class="g g3">${tile('M34')}${tile('M36')}${stat('Awaiting feedback',DISP.eval-DISP.fb,'oldest 14 days',{cls:'bad'})}</div><div class="g g2">${fun}${age}</div>`+dl;
}};
const DSX={over:0,new:0,fb:0};
ACT.dsthr=(v,el)=>{S.pg.ds.thr=+v;sliderLabel(el,v+' days');refresh('dsage')};

const QCORR=[['Q5',.52],['Q6',.47],['Q4',.44],['Q3',.39],['Q10',.36],['Q11',.31],['Q7',.27],['Q2',.22],['Q9',.21],['Q8',.18],['Q1',.09],['Q12',.07]];
P.qavscsat={title:'Quality vs. Customer',sub:'QA · QA score vs. CSAT',filters:'',body(){
  const spec=w=>wspec('QA','Quality vs. Customer',w);
  return `<div class="row wrap"><span class="muted sm">Minimum CSAT responses per agent</span><div style="width:200px">${slider('qcmin',{min:20,max:60,val:S.pg.qc.min,fmt:v=>v,label:'Minimum responses'})}</div><span class="sp1"></span>${menuBtn('qc_team','out',S.pg.qc.team)}</div>`+R('qcmain',()=>{
    const q=S.pg.qc,pts=AG.filter(a=>a.n>=q.min&&(q.team==='All teams'||a.team===q.team)),
      sc=pts.length>=3?scatter({points:pts.map(a=>({x:a.M27,y:a.M46,r:5+a.n/9,color:colOf(a.name),act:'agent',arg:a.name,tip:`<b>${esc(a.name)}</b><br>QA ${a.M27} · CSAT ${a.M46}%<br>n = ${a.n} responses`})),xlab:'QA score',ylab:'CSAT %',xmin:74,xmax:98,ymin:70,ymax:95}):null;
    const r=sc?sc.r:0,strength=Math.abs(r)>=.6?'strong':Math.abs(r)>=.35?'moderate':'weak';
    return `<div class="g g21">${card('Does QA score predict CSAT?',sc?sc.svg+`<div class="xs muted" style="text-align:center">Each dot is an agent, sized by number of CSAT responses. Click a dot to open the agent. Dashed line is the best fit.</div>`:'<div class="empty">Too few agents meet the minimum sample. Lower the threshold.</div>',{info:spec('QA vs. CSAT')})}
    <div class="g" style="align-content:start">${card('Correlation',`<div style="font-size:40px;font-weight:500">${sc?r.toFixed(2):'—'}</div><div class="muted">${sc?`A ${strength} positive relationship`:'Not enough data'}</div><div class="row wrap mt">${chip('n = '+pts.length+' agents','gray')}${chip('Quarterly','gray')}</div><div class="note mt">${ico('info','sm')}<div>This is a correlation of agent averages, not of individual contacts, so treat it as a signal. Agents under ${q.min} responses are excluded.</div></div>`)}${ask('Does QA score predict CSAT?','Ask NextIQ')}</div></div>`}),
  card('Which questions track with CSAT?',hbars(QCORR.map(c=>({k:QS.find(x=>x.id===c[0]).label,v:c[1]*100,color:c[1]<.15?'#C9C5BC':'#8E7CC3',tip:`<b>${esc(QS.find(x=>x.id===c[0]).label)}</b><br>Correlation with CSAT: ${c[1].toFixed(2)}`})),{max:60,fmt:v=>(v/100).toFixed(2)}),{sub:'Grey bars barely move CSAT. Consider reviewing those questions on the form.',right:ask('Which questions don\'t correlate with CSAT?','Ask NextIQ')});
}};

/* ================= WFM: Forecast & Plan ================= */
S.pg.fc={miss:12,h:7,view:'Interval'};
const DAYACC=[93,91,94,88,92,90,95],WKACC=[91,92,90,89,91,93,92,92];
P.forecast={title:'Forecast & Plan',sub:'WFM · Volume forecast',filters:'rq',body(){
  const spec=w=>wspec('WFM','Forecast and Plan',w);
  return card('Forecast vs. actual',`<div class="row wrap" style="margin:-4px 0 6px"><span class="muted sm">Flag intervals missing by more than</span><div style="width:170px">${slider('fcmiss',{min:5,max:25,val:S.pg.fc.miss,fmt:v=>v+'%',label:'Forecast miss threshold'})}</div><span class="sp1"></span><span class="muted sm">Lock-in horizon</span><div style="width:170px">${slider('fch',{min:1,max:14,val:S.pg.fc.h,fmt:v=>v+' days',label:'Forecast lock-in horizon'})}</div></div>`+R('fcm',()=>{
    const c=wfmCalc(),m=S.pg.fc.miss,lab=WFM.labels,bands=[],err=WFM.ac.map((a,i)=>a==null?null:(a-WFM.fc[i])/WFM.fc[i]*100);
    err.forEach((e,i)=>{if(e!=null&&Math.abs(e)>m)bands.push([i-.5,i+.5,'#FFF1CC'])});
    const adj=clamp(c.wape*100-(S.pg.fc.h-7)*.35,70,99.5),bias=sum(WFM.ac.filter(x=>x!=null))/sum(WFM.fc.slice(0,WFM.now+1))*100-100;
    return `<div class="g g4" style="margin-bottom:12px"><div class="tile ${adj>=tgt('M23')?'good':'warn'}" ${A('go','metric/M23')}><h5>${ragDot(adj>=tgt('M23')?'good':'warn')} Forecast accuracy (WAPE)</h5><div class="v">${f1(adj)}%</div><div class="muted xs">version locked ${S.pg.fc.h} days ahead</div></div>${tile('M01')}${tile('M04')}<div class="tile"><h5>Forecast bias</h5><div class="v">${bias>0?'+':''}${f1(bias)}%</div><div class="muted xs">${bias>0?'Actual running above forecast':'Actual running below forecast'}</div></div></div>`+lineChart({labels:lab,h:300,xEvery:2,yFmt:Math.round,bands,markers:[{i:WFM.now,label:'Now'}],series:[{name:'Forecast',color:'#C9C5BC',data:WFM.fc,dash:'6 4',w:2.4},{name:'Actual',color:'#3FA3A3',data:WFM.ac,w:2.8}],tip:i=>`<b>${lab[i]}</b><br>Forecast ${WFM.fc[i]}<br>${WFM.ac[i]!=null?`Actual ${WFM.ac[i]}<br>Error <b>${err[i]>0?'+':''}${f1(err[i])}%</b>`:'Actual not yet available'}`})+legend([{name:'Forecast',color:'#C9C5BC'},{name:'Actual',color:'#3FA3A3'},{name:`Miss over ${m}%`,color:'#FFE9A6',sq:1}])+`<div class="xs muted" style="text-align:center">${bands.length} interval${bands.length===1?'':'s'} exceeded the miss threshold. ${S.pg.fc.h<7?'Shorter lock-in horizons usually forecast better.':'Longer horizons give schedulers more notice but less accuracy.'}</div>`}),{info:spec('Forecast vs. actual')})
  +card('Accuracy by interval, day and week',`<div class="row" style="margin:-4px 0 8px">${seg(['Interval','Day','Week'],S.pg.fc.view,'fcview')}</div>`+R('fcacc',()=>{
    const v=S.pg.fc.view,adj=-(S.pg.fc.h-7)*.35;
    if(v==='Interval'){const e=WFM.ac.map((a,i)=>a==null?null:100-Math.abs(a-WFM.fc[i])/a*100);return barChart({labels:WFM.labels.slice(0,WFM.now+1),h:240,yMin:0,yMax:100,yFmt:Math.round,target:tgt('M23'),targetLabel:'Target '+tgt('M23')+'%',groups:[{name:'Accuracy',color:'#68BFBF',colors:e.slice(0,WFM.now+1).map(x=>x<tgt('M23')-3?'#EA6C8B':'#68BFBF'),data:e.slice(0,WFM.now+1)}],tip:(g,i)=>`<b>${WFM.labels[i]}</b><br>${f1(e[i])}% accurate`})}
    const d=v==='Day'?DAYACC.map(x=>x+adj):WKACC.map(x=>x+adj),l=v==='Day'?DAYS:['W1','W2','W3','W4','W5','W6','W7','W8'];
    return barChart({labels:l,h:240,yMin:0,yMax:100,yFmt:Math.round,target:tgt('M23'),targetLabel:'Target '+tgt('M23')+'%',groups:[{name:'Accuracy',color:'#68BFBF',colors:d.map(x=>x<tgt('M23')?'#EA6C8B':'#68BFBF'),data:d}],tip:(g,i)=>`<b>${l[i]}</b><br>${f1(d[i])}% accurate`,act:v==='Day'?'nq_ask':null,actArg:(g,i)=>`Why did we miss the forecast on ${DAYS[i]}?`})+(v==='Day'?'<div class="xs muted" style="text-align:center">Click a day to ask NextIQ why it missed.</div>':'')}),{info:'M23 Forecast accuracy by interval, day and week.',right:ask('Why did we miss the forecast on Monday?','Ask NextIQ')});
}};
ACT.fcmiss=(v,el)=>{S.pg.fc.miss=+v;sliderLabel(el,v+'%');refresh('fcm')};
ACT.fch=(v,el)=>{S.pg.fc.h=+v;sliderLabel(el,v+' days');refresh('fcm');refresh('fcacc')};

/* ================= WFM: Staffing ================= */
S.pg.sf={slT:80,th:20,ex:0,vol:190,aht:342};
P.staffing={title:'Staffing',sub:'WFM · Required vs. scheduled vs. actual',filters:'rq',body(){
  const spec=w=>wspec('WFM','Staffing',w);
  const ctl=card('Staffing assumptions',`<div class="g g4" style="gap:20px"><div><label class="l">Service level target</label>${slider('sfsl',{min:50,max:95,val:S.pg.sf.slT,fmt:v=>v+'%',label:'Service level target'})}</div><div><label class="l">Answer threshold</label>${slider('sfth',{min:10,max:60,step:5,val:S.pg.sf.th,fmt:v=>v+'s',label:'Threshold'})}</div><div><label class="l">Extra shrinkage (what-if)</label>${slider('sfex',{min:0,max:10,step:.5,val:S.pg.sf.ex,fmt:v=>'+'+v+' pts',label:'Extra shrinkage'})}</div><div><label class="l">Interval length</label><div class="b" style="padding-top:6px">30 minutes</div><div class="muted xs">Open decision #15</div></div></div>`,{info:'Required staff uses Erlang C with these assumptions and a 30% base shrinkage.'});
  const main=R('sfmain',()=>{
    const s=S.pg.sf,c=wfmCalc({extraShrink:s.ex/100,slT:s.slT/100,th:s.th}),base=wfmCalc({slT:s.slT/100,th:s.th}),lab=WFM.labels,bands=[];
    c.var.forEach((v,i)=>{if(v<-2)bands.push([i-.5,i+.5,'#FDE3E3']);else if(v>6)bands.push([i-.5,i+.5,'#E4F2FB'])});
    const dSL=c.avgSL-base.avgSL,peak=Math.max(...c.req),under=c.var.filter(v=>v<-2).length,over=c.var.filter(v=>v>6).length;
    return `<div class="g g4"><div class="tile" ${A('go','metric/M24')}><h5>Peak required (M24)</h5><div class="v">${f1(peak,0)} FTE</div><div class="muted xs">at ${lab[c.req.indexOf(peak)]}</div></div><div class="tile ${c.avgVar<-1?'bad':'good'}" ${A('go','metric/M25')}><h5>Avg staffing variance (M25)</h5><div class="v">${c.avgVar>0?'+':''}${f1(c.avgVar)} FTE</div><div class="muted xs">${under} under · ${over} over intervals</div></div><div class="tile" ${A('go','metric/M26')}><h5>Schedule efficiency (M26)</h5><div class="v">${f1(Math.min(99.9,c.eff))}%</div><div class="muted xs">required ÷ scheduled hours</div></div><div class="tile ${c.avgSL>=s.slT?'good':'bad'}"><h5>Projected service level</h5><div class="v">${f1(c.avgSL)}%</div><div class="muted xs">${s.ex?`${dSL<0?'':'+'}${f1(dSL)} pts from +${s.ex} pts shrinkage`:'at the planned schedule'}</div></div></div>`
    +(s.ex>0?`<div class="note ${dSL<-1?'bad':'info'}" style="margin-top:12px">${ico('spark','sm')}<div><b>Estimate:</b> an extra ${s.ex} points of shrinkage lowers projected service level by ${f1(Math.abs(dSL))} points and raises peak requirement to ${f1(peak,0)} FTE. This is a model estimate, not a forecast.</div></div>`:'')
    +card('Required vs. scheduled vs. actual',lineChart({labels:lab,h:300,xEvery:2,yFmt:Math.round,bands,markers:[{i:WFM.now,label:'Now'}],series:[{name:'Required',color:'#EA6C8B',data:c.req,dash:'5 4'},{name:'Scheduled',color:'#C9C5BC',data:WFM.sch},{name:'Actual',color:'#5B8BBF',data:c.act.map((v,i)=>i<=WFM.now?v:null),w:2.8}],tip:i=>`<b>${lab[i]}</b><br>Required ${f1(c.req[i],1)}<br>Scheduled ${WFM.sch[i]}<br>${i<=WFM.now?'Actual '+c.act[i]+'<br>':''}Variance <b>${c.var[i]>0?'+':''}${f1(c.var[i])}</b>`,act:'sfint',actArg:i=>i})+legend([{name:'Required',color:'#EA6C8B'},{name:'Scheduled',color:'#C9C5BC'},{name:'Actual',color:'#5B8BBF'},{name:'Understaffed',color:'#FDE3E3',sq:1},{name:'Overstaffed',color:'#E4F2FB',sq:1}])+`<div class="xs muted" style="text-align:center">Click an interval to see the Erlang C workings.</div>`,{info:spec('Required vs. scheduled vs. actual'),cls:'mt'})
    +`<div class="g g2">`+card('Staffing variance by interval',barChart({labels:lab,h:240,xEvery:1,yFmt:v=>f1(v,0),groups:[{name:'Variance (FTE)',color:'#68BFBF',colors:c.var.map(v=>v<-2?'#EA6C8B':v>6?'#7FB5DD':'#68BFBF'),data:c.var.map(v=>v)}],yMin:undefined,tip:(g,i)=>`<b>${lab[i]}</b><br>${c.var[i]>0?'+':''}${f1(c.var[i])} FTE`,act:'sfint',actArg:(g,i)=>i}),{info:spec('Required vs. scheduled vs. actual')})
    +card('Service level: actual vs. planned',lineChart({labels:lab,h:240,xEvery:2,yMin:0,yMax:100,yFmt:Math.round,markers:[{i:WFM.now,label:'Now'}],target:{v:s.slT,label:'Target '+s.slT+'%',color:'#2EA06F'},series:[{name:'Planned',color:'#C9C5BC',data:c.slPlan,dash:'5 4'},{name:'Actual',color:'#3FA3A3',data:c.sl.map((v,i)=>i<=WFM.now?v:null),w:2.6}],tip:i=>`<b>${lab[i]}</b><br>Planned ${f1(c.slPlan[i],0)}%<br>${i<=WFM.now?'Actual '+f1(c.sl[i],0)+'%':''}`}),{info:'M53 Service level vs. forecast. Actual minus planned, per interval.'})+`</div>`;
  });
  const calc=card('How many agents do we need?',`<div class="g g3" style="gap:20px"><div><label class="l">Contacts in a 30-minute interval</label>${slider('sfvol',{min:20,max:320,val:S.pg.sf.vol,fmt:v=>v,label:'Volume'})}</div><div><label class="l">Average handle time</label>${slider('sfaht',{min:180,max:600,step:6,val:S.pg.sf.aht,fmt:v=>dur(v),label:'AHT'})}</div><div>${R('sfcalc',()=>{const s=S.pg.sf,r=reqAgents(s.vol,s.aht,s.slT/100,s.th,.30+s.ex/100);return `<div class="row wrap" style="gap:18px"><div><div class="muted xs">Agents on phones</div><div style="font-size:26px;font-weight:500">${r.n}</div></div><div><div class="muted xs">To schedule (FTE)</div><div style="font-size:26px;font-weight:500">${f1(r.fte,0)}</div></div><div><div class="muted xs">Workload</div><div style="font-size:26px;font-weight:500">${f1(r.A)} <span class="muted" style="font-size:13px">erlangs</span></div></div></div>`})}</div></div><div class="muted xs mt">Erlang C model. Assumes ${S.pg.sf.slT}% answered in ${S.pg.sf.th}s, 30% shrinkage and no abandonment. Chat and messaging need a concurrency-aware model.</div>`,{info:'Answers “How many agents do we need next Tuesday at 10am?” using the Tuesday 10am forecast, or any volume you choose.',right:ask('How many agents do we need next Tuesday at 10am?','Ask NextIQ')});
  return ctl+main+calc;
}};
ACT.sfsl=(v,el)=>{S.pg.sf.slT=+v;sliderLabel(el,v+'%');refresh('sfmain');refresh('sfcalc')};
ACT.sfth=(v,el)=>{S.pg.sf.th=+v;sliderLabel(el,v+'s');refresh('sfmain');refresh('sfcalc')};
ACT.sfex=(v,el)=>{S.pg.sf.ex=+v;sliderLabel(el,'+'+v+' pts');refresh('sfmain');refresh('sfcalc')};
ACT.sfvol=(v,el)=>{S.pg.sf.vol=+v;sliderLabel(el,v);refresh('sfcalc')};

    <div class="g g21">${card('Adherence by interval',lineChart({labels:WFM.labels.slice(0,WFM.now+1),h:260,xEvery:2,yMin:70,yMax:100,yFmt:Math.round,series:[{name:'Adherence %',color:'#E0A63A',data:iv,area:true}],target:{v:tgt('M16'),label:'Target '+tgt('M16')+'%'}}),{info:spec('Adherence and conformance')})}${card('Agent ranking',hbars(rank.slice(0,8).map(a=>({k:a.name,v:a.adh,color:a.adh>=tgt('M16')?'#2EA06F':'#EA6C8B',act:'agent',arg:a.name})),{max:100,target:tgt('M16'),fmt:v=>f1(v)+'%'})+`<div class="xs muted mt">Lowest eight agents shown.</div>`)}</div>
    ${card('Exception management queue',ex.length?table([{h:'Agent'},{h:'Time'},{h:'Scheduled'},{h:'Actual'},{h:'Out by',cls:'r'},{h:'Reason'},{h:'Decision',cls:'r'}],ex.map(e=>`<tr><td><div class="who rc" ${A('agent',e.agent)}>${avatar(e.agent,colOf(e.agent))}${esc(e.agent)}</div></td><td class="nw">${e.time}</td><td>${e.sched}</td><td>${e.actual}</td><td class="r b" style="color:#D4343A">${e.min} min</td><td class="muted sm">${esc(e.why)}</td><td class="r nw"><button class="btn sm" ${A('adres',e.id+'|ok')}>Approve</button> <button class="btn sm" ${A('adres',e.id+'|no')}>Reject</button></td></tr>`)):'<div class="empty">The exception queue is clear.</div>',{cls:'flat',info:spec('Adherence and conformance')+'<br>Approve to excuse an exception, reject to keep it against adherence.'})}`;

const EFF=['M41','M42','M43','M38','M39','M27','M30','M08','M10'],PRODUCTIVITY=['M04','M13','M14','M15','M45','M44','M19','M20','M21'];
function narrative(){
  const d=id=>deltaInfo(id),v=id=>fmtV(id),out=[];
  out.push({k:'good',t:`Service level is ${v('M08')}, ${f1(Math.abs(d('M08').d))} pts ${d('M08').d>=0?'up':'down'} on last week and ${status('M08')==='good'?'above':'below'} the ${fmtT('M08')} target.`,go:'metric/M08'});
  const conf=d('M04').d<0&&d('M41').d<0;
  out.push({k:conf?'bad':'good',t:conf?`AHT improved by ${dur(Math.abs(d('M04').d))} to ${v('M04')}, but first contact resolution slipped ${f1(Math.abs(d('M41').d))} pts to ${v('M41')}, below the ${fmtT('M41')} target. The speed gain may be costing resolution.`:`AHT is ${v('M04')} and FCR is ${v('M41')}. Productivity and effectiveness are moving together.`,go:'effvsprod'});
  out.push({k:status('M46')==='good'?'good':'warn',t:`CSAT is ${v('M46')} (n = ${fmtN(CSATN)} responses), ${f1(Math.abs(d('M46').d))} pt${Math.abs(d('M46').d)===1?'':'s'} ${d('M46').d<0?'lower':'higher'} than last week. NPS is ${v('M47')} (${d('M47').d>0?'+':''}${f1(d('M47').d,0)}). The biggest driver is longer waits in the Support queue.`,go:'csat'});
  out.push({k:'warn',t:`Cost per contact is ${v('M45')}, ${d('M45').d>0?'up':'down'} ${'$'+Math.abs(d('M45').d).toFixed(2)}. Self-service containment is ${v('M44')}, just under its ${fmtT('M44')} target.`,go:'metric/M45'});
  out.push({k:'warn',t:`Unplanned absence reached 9.6% on Thursday and attrition is ${v('M21')} annualised, above the ${fmtT('M21')} target.`,go:'capacity'});
  return out;
}

  +card('This week in plain English',R('exn',()=>{const gen=S.pg.ex.gen;return gen===1?`<div class="muted typing" style="padding:16px"><i></i><i></i><i></i> NextIQ is summarising the week…</div>`:`<div class="lst">${narrative().map(n=>`<div class="li rc" ${A('go',n.go)}><span class="dot ${n.k==='good'?'d-good':n.k==='bad'?'d-bad':'d-warn'}"></span><div class="sp1">${esc(n.t)}</div></div>`).join('')}</div><div class="xs muted mt">Period: last 30 days vs. prior week. Definitions: service level answered within 20 s; FCR = no repeat contact within 7 days; CSAT top-box 4–5. Auto-generated from governed metrics.</div>`}),{info:spec('One-page scorecard')+'<br>Narrative callouts are generated from computed results.',right:`<button class="btn sm" ${A('exregen')}>${ico('spark','xs')} Regenerate</button><button class="btn sm" ${A('excopy')}>${ico('copy','xs')} Copy</button>`})

function pillarPage(key,ids,title,sub,pg,other,otherIds,otherName,guard){
  const st=S.pg[key];
  const trend=card('Trend vs. target',`<div class="row wrap" style="margin:-4px 0 8px">${seg(ids.slice(0,6).map(i=>[i,MI[i].name.replace(' (AHT)','').replace('First contact resolution (FCR)','FCR')]),st.m,key+'m')}</div>`+R(key+'ch',()=>{const id=st.m,s=series(id,30,key),t=tgt(id),mn=Math.min(...s),mx=Math.max(...s,t??-1e9),pad=(mx-mn||1)*.6;
    return lineChart({labels:daysBack(30),h:260,xEvery:5,yMin:Math.max(0,mn-pad),yMax:mx+pad,yFmt:axFmt(id),series:[{name:MI[id].name,color:'#3FA3A3',data:s,area:true}],target:t!=null?{v:t,label:'Target '+fmtT(id)}:null,act:'go',actArg:()=>'metric/'+id})}));
  const sc=card(title,`<div class="row" style="margin:-4px 0 8px;justify-content:space-between"><span class="muted sm">${esc(sub)}</span><div class="row" style="gap:8px"><span class="muted sm">Show ${otherName} side by side</span><button class="sw ${st.side?'on':''}" ${A('pillside',key)} aria-label="Toggle side by side" role="switch" aria-checked="${st.side}"></button></div></div>`+(st.side?`<div class="g g2"><div><div class="b sm" style="margin-bottom:6px">${title}</div>${scoreTable(ids)}</div><div><div class="b sm" style="margin-bottom:6px">${otherName}</div>${scoreTable(otherIds)}</div></div>`:scoreTable(ids)),{cls:'flat',info:wspec('Leadership',pg,'Resolution and compliance')||wspec('Leadership',pg,'Efficiency and cost')});
  return `<div class="note">${ico('bolt','sm')}<div>${guard}</div></div>`+sc.replace('class="card flat"','class="card" style="padding:18px 20px"')+trend;
}

P.csat={title:'CSAT & NPS',sub:'Leadership · Customer sentiment',filters:'rq',body(){
  const spec=w=>wspec('Leadership','CSAT & NPS',w);
  const tiles=`<div class="g g5">${['M46','M47','M48','M49','M50'].map(id=>{const s=status(id),d=deltaInfo(id,'last month');return `<div class="tile ${s}" ${A('go','metric/'+id)}><h5>${ragDot(s)} ${esc(MI[id].name)}</h5><div class="v">${fmtV(id)}</div><div class="row xs" style="gap:8px"><span class="dl ${d.cls}">${d.txt.replace(' vs. last month','')}</span><span class="muted">Target ${fmtT(id)}</span></div>${id==='M46'||id==='M48'?`<div class="chip c-gray" style="width:max-content">n = ${fmtN(CSATN)}</div>`:id==='M47'?`<div class="chip c-gray" style="width:max-content">n = ${fmtN(NPSD.n)}</div>`:''}</div>`}).join('')}</div>`;
  const tr=card('CSAT and NPS trend',lineChart({labels:daysBack(30),h:260,xEvery:5,yMin:20,yMax:100,yFmt:Math.round,series:[{name:'CSAT %',color:'#3FA3A3',data:series('M46',30)},{name:'NPS',color:'#8E7CC3',data:series('M47',30).map(x=>x+30)}],tip:i=>`<b>${daysBack(30)[i]}</b><br>CSAT ${f1(series('M46',30)[i])}%<br>NPS ${f1(series('M47',30)[i],0)}<br><span style="opacity:.7">n ≈ ${fmtN(CSATN/30)} responses/day</span>`})+legend([{name:'CSAT %',color:'#3FA3A3'},{name:'NPS (shifted +30 for scale)',color:'#8E7CC3'}]),{info:spec('Trend, driver analysis, verbatim themes')});
  const nps=card('NPS composition',`<div class="row" style="height:36px;border-radius:9px;overflow:hidden;gap:2px;margin:8px 0"><div style="flex:${NPSD.pro};background:#2EA06F;color:#fff;display:grid;place-items:center;font-weight:600" ${TIP(`<b>Promoters</b><br>${NPSD.pro}% · 9–10`)}>${NPSD.pro}%</div><div style="flex:${NPSD.pas};background:#C9C5BC;display:grid;place-items:center;font-weight:600" ${TIP(`<b>Passives</b><br>${NPSD.pas}% · 7–8`)}>${NPSD.pas}%</div><div style="flex:${NPSD.det};background:#EA6C8B;color:#fff;display:grid;place-items:center;font-weight:600" ${TIP(`<b>Detractors</b><br>${NPSD.det}% · 0–6`)}>${NPSD.det}%</div></div>${legend([{name:'Promoters 9–10',color:'#2EA06F'},{name:'Passives 7–8',color:'#C9C5BC'},{name:'Detractors 0–6',color:'#EA6C8B'}])}<div class="muted sm mt" style="text-align:center">NPS = ${NPSD.pro}% − ${NPSD.det}% = <b>${NPSD.pro-NPSD.det}</b> · n = ${fmtN(NPSD.n)} responses · transactional</div>`,{info:'M47 NPS. Passives count in the denominator only. Transactional vs. relational is open decision #10.'});
  const dims=['Queue','Channel','Agent','Reason'];
  const seg2=card('CSAT by segment',`<div class="row wrap" style="margin:-4px 0 6px">${seg(dims,S.pg.cs.dim,'csdim')}${S.pg.cs.dim==='Agent'?`<span class="sp1"></span><span class="muted sm">Min responses</span><div style="width:150px">${slider('csmin',{min:10,max:60,val:S.pg.cs.min,fmt:v=>v,label:'Minimum responses'})}</div>`:''}</div>`+R('csseg',()=>{
    const d=S.pg.cs.dim,r=rng('cs'+d);let rows;
    if(d==='Queue')rows=Object.keys(QF).map(k=>({k,v:84+(r()-.5)*8,n:Math.round(CSATN*QF[k])}));
    else if(d==='Channel')rows=Object.keys(CF).map(k=>({k,v:84+(r()-.5)*10,n:Math.round(CSATN*CF[k])}));
    else if(d==='Agent')rows=AG.map(a=>({k:a.name,v:a.M46,n:a.n,agent:true}));
    else rows=CONTACT_REASONS.map(c=>({k:c[0],v:90-c[3]*.9+(r()-.5)*3,n:Math.round(CSATN*c[1]/15000)}));

  drawer(s.name,`<div class="card"><p style="margin:0">${esc(s.provides)}</p></div><div class="card"><dl class="kv"><dt>Integration</dt><dd>${esc(s.method)}</dd><dt>Latency</dt><dd>${esc(s.latency)}</dd><dt>Join keys</dt><dd><div class="row wrap" style="gap:6px">${s.keys.split(',').map(k=>`<span class="chip c-violet mono">${esc(k.trim())}</span>`).join('')}</div></dd><dt>Key fields</dt><dd>${esc(s.fields)}</dd><dt>Metrics fed</dt><dd>${esc(s.feeds)}</dd></dl></div><div class="card"><div class="ct"><h3>Metrics from this source</h3></div><div class="row wrap" style="gap:4px">${DATA.metrics.filter(m=>m.source.split(',').some(x=>s.name.toLowerCase().includes(x.trim().toLowerCase().split(' ')[0])||x.trim().toLowerCase().includes(s.name.toLowerCase().split(' ')[0]))).map(m=>mchip(m.id)).join('')}</div></div>`,{sub:'Source system'})};

S.pg.dm={sel:'fact_interaction',q:'',t:'All'};
P.model={title:'Data Model',sub:'Proposed facts and dimensions',filters:'',body(){
  const types=['All','Fact','Dimension','Config'],M=DATA.model,d=M.find(x=>x.table===S.pg.dm.sel)||M[0];
  const hub=M.find(x=>x.table==='fact_interaction'),spokes=['dim_agent','dim_queue','dim_channel','dim_date / dim_interval','dim_disposition / dim_reason','dim_customer','fact_evaluation','fact_survey_response','fact_case_contact','fact_agent_state'];
  const W=700,H=330,c=[W/2,H/2];let g='';
  spokes.forEach((s,i)=>{const a=i/spokes.length*Math.PI*2-Math.PI/2,x=c[0]+Math.cos(a)*250,y=c[1]+Math.sin(a)*125,isF=s.startsWith('fact');g+=`<line x1="${c[0]}" y1="${c[1]}" x2="${x}" y2="${y}" stroke="${isF?'#8EB4DA':'#D8D4CA'}" stroke-width="1.4"/><g class="node ${S.pg.dm.sel===s?'on':''}" ${A('dmsel',s)}><rect x="${x-75}" y="${y-15}" width="150" height="30" rx="9" ${isF?'style="stroke:#8EB4DA"':''}/><text x="${x}" y="${y+4}" text-anchor="middle" style="font-size:11px">${esc(s)}</text></g>`});
  g+=`<g class="node ${S.pg.dm.sel==='fact_interaction'?'on':''}" ${A('dmsel','fact_interaction')}><rect x="${c[0]-70}" y="${c[1]-22}" width="140" height="44" rx="12" style="stroke:#1F5FCC;stroke-width:2"/><text x="${c[0]}" y="${c[1]+4}" text-anchor="middle">fact_interaction</text></g>`;
  const list=R('dmlist',()=>{const f=S.pg.dm,l=M.filter(m=>(f.t==='All'||m.type.startsWith(f.t))&&(m.table+m.notes).toLowerCase().includes(f.q.toLowerCase()));return ['Fact','Dimension','Config'].map(t=>{const rows=l.filter(m=>m.type.startsWith(t));return rows.length?`<div class="ngroup"><div class="hd">${t==='Fact'?'Facts':t==='Dimension'?'Dimensions':'Configuration'} (${rows.length})</div>${rows.map(m=>`<div class="li rc" ${A('dmsel',m.table)} style="padding:9px 14px;${S.pg.dm.sel===m.table?'background:#F2F7FE':''}"><span class="mono sp1" style="font-size:12px;font-weight:600">${esc(m.table)}</span><span class="muted xs">${esc(m.type.replace('Dimension (SCD2)','SCD2').replace('Fact (aggregate)','agg'))}</span></div>`).join('')}</div>`:''}).join('')});
  return `<div class="row wrap">${seg(types,S.pg.dm.t,'dmt')}<input type="text" ${IN('dmq')} placeholder="Search tables" value="${esc(S.pg.dm.q)}" style="max-width:240px"></div><div class="g g12" style="grid-template-columns:minmax(0,1fr) minmax(0,1.9fr)"><div class="card flat" style="max-height:640px;overflow:auto">${list}</div><div class="g" style="align-content:start">${R('dmdet',()=>dmDetail())}${card('Star around fact_interaction',`<div class="erd"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg></div><div class="xs muted" style="text-align:center">Keep a legs table if transfers matter. Click any node to inspect it.</div>`)}</div></div>`;
}};
function dmDetail(){const d=DATA.model.find(x=>x.table===S.pg.dm.sel)||DATA.model[0],ms=[...new Set((d.notes.match(/M\d{2}/g)||[]))],cols=d.cols.split(',').map(x=>x.trim()).filter(Boolean);
  const mr=(d.notes.match(/M(\d{2})-M(\d{2})/g)||[]).flatMap(r=>{const[a,b]=r.match(/\d+/g).map(Number);return Array.from({length:b-a+1},(_,i)=>'M'+String(a+i).padStart(2,'0'))});
  const all=[...new Set([...ms,...mr])];
  return card(`<span class="mono">${esc(d.table)}</span>`,`<div class="row wrap" style="gap:6px;margin-bottom:10px">${chip(d.type,d.type.startsWith('Fact')?'blue':d.type.startsWith('Dim')?'violet':'amber')}</div><dl class="kv"><dt>Grain</dt><dd>${esc(d.grain)}</dd><dt>Key columns</dt><dd><div class="row wrap" style="gap:5px">${cols.map(c=>`<code>${esc(c)}</code>`).join('')}</div></dd><dt>Notes</dt><dd>${esc(d.notes)}</dd>${all.length?`<dt>Feeds metrics</dt><dd><div class="row wrap" style="gap:4px">${all.slice(0,20).map(mchip).join('')}</div></dd>`:''}</dl>`)}
ACT.dmsel=a=>{const ok=DATA.model.find(x=>x.table===a);if(!ok){const m=DATA.model.find(x=>x.table.startsWith(a.split(' ')[0]));if(m)a=m.table}S.pg.dm.sel=a;render(true)};
ACT.dmt=a=>{S.pg.dm.t=a;render(true)};ACT.dmq=v=>{S.pg.dm.q=v;refresh('dmlist')};
/* ---- Open decisions ---- */
S.pg.od={owner:'All'};
const OSTAT=['Open','In review','Agreed'],OCOL={Open:'amber','In review':'blue',Agreed:'green'};
P.decisions={title:'Open Decisions',sub:'Definitions to agree before build',filters:'',body(){
  const owners=['All',...new Set(DATA.decisions.flatMap(d=>d.owner.split(',').map(x=>x.trim())))];
  return R('odsum',()=>{const n=DATA.decisions.length,ag=DATA.decisions.filter(d=>(S.decisions[d.n]||'Open')==='Agreed').length,rv=DATA.decisions.filter(d=>(S.decisions[d.n]||'Open')==='In review').length;
    return card('Readiness to build',`<div class="row" style="gap:18px;align-items:center"><div style="font-size:34px;font-weight:500">${ag}<span class="muted" style="font-size:15px;font-weight:400"> of ${n} agreed</span></div><div class="sp1">${pbar(ag/n*100,ag===n?'good':'')}<div class="xs muted mt">${rv} in review · ${n-ag-rv} open</div></div></div>`)})+`<div class="row wrap">${seg(owners.slice(0,12),S.pg.od.owner,'odown')}</div>`+R('odt',()=>{
    const l=DATA.decisions.filter(d=>S.pg.od.owner==='All'||d.owner.includes(S.pg.od.owner));
    return card('',table([{h:'#'},{h:'Decision'},{h:'What to settle'},{h:'Metrics affected'},{h:'Suggested owner'},{h:'Status'}],l.map(d=>{const s=S.decisions[d.n]||'Open';return `<tr><td class="muted">${d.n}</td><td class="b" style="min-width:160px">${esc(d.decision)}</td><td class="sm" style="min-width:240px">${esc(d.what)}</td><td><div class="row wrap" style="gap:4px">${/All/i.test(d.metrics)?chip('All metrics','gray'):d.metrics.split(',').map(x=>x.trim()).map(x=>/^M\d\d$/.test(x)?mchip(x):chip(x,'gray')).join('')}</div></td><td class="sm">${esc(d.owner)}</td><td><button class="chip c-${OCOL[s]}" style="border:0" ${A('odcyc',d.n)} ${TIP('Click to change status')}>${s}</button></td></tr>`})),{cls:'flat'})});
}};
ACT.odown=a=>{S.pg.od.owner=a;refresh('odt')};
ACT.odcyc=n=>{const c=S.decisions[n]||'Open';S.decisions[n]=OSTAT[(OSTAT.indexOf(c)+1)%3];refresh('odt');refresh('odsum')};

/* ================= proposed metrics (extend the 53-metric workbook) ================= */
const PROP_IV=[['M54','Intervention rate','Supervisor interventions ÷ handled contacts × 100','%'],['M55','Time to intervene','Seconds from trigger (alert or request) to supervisor action','s'],['M56','Intervention save rate','Interventions that ended resolved with sentiment improved ÷ interventions × 100','%'],['M57','Sentiment lift','Sentiment score after − before intervention','pts'],['M58','Handle-time impact','AHT of intervened contacts − matched no-intervention baseline','s'],['M59','Post-intervention CSAT','Satisfied responses on intervened contacts ÷ responses × 100','%'],['M60','Takeover coaching follow-up','Takeovers followed by coaching within 3 days ÷ takeovers × 100','%']];
const PROP_AI=[['M61','AI containment rate','AI-employee conversations resolved without a person ÷ AI conversations × 100','%'],['M62','True containment','Contained conversations with no repeat contact within N days ÷ sessions × 100','%'],['M63','Handoff-with-context rate','Handoffs where the agent received transcript and intent ÷ handoffs × 100','%'],['M64','Containment cost avoided','Contained sessions × (cost per agent contact − automation cost per session)','$']];
const proposedCard=(l,t)=>card(t||'Proposed metric additions',`<div class="muted sm" style="margin:-6px 0 10px">These extend the 53 metrics in your workbook. Each still needs its definition decisions agreed before build.</div>`+table([{h:'ID'},{h:'Metric'},{h:'Formula'},{h:'Status'}],l.map(m=>`<tr><td class="mono muted">${m[0]}</td><td class="b">${m[1]}</td><td class="muted sm">${m[2]}</td><td>${chip('Proposed','amber')}</td></tr>`)),{cls:'flat'});
/* ================= CONTAINMENT: overall ================= */
const AUTO=[{k:'IVR flows',n:21400,c:32.9,rep:21,ho:38,csat:3.9,col:'#5B8BBF'},{k:'Web chat bot',n:9300,c:38.2,rep:17,ho:34,csat:4.0,col:'#68BFBF'},{k:'AI employees',n:3942,c:34.5,rep:14,ho:28,csat:4.3,col:'#6B63D6'}];
const INTENTS_ALL=[['Order status',8000,45],['Billing and balance',7400,22],['Claim status',5200,21],['Scheduling',3600,58],['Reconnect equipment',3000,41],['Refund request',2400,14],['Product features',1800,52],['Account access',3242,31]];
const repF=N=>N<=7?.6+.4*(N-3)/4:1+.6*(N-7)/23;
const COST_AGENT=6.42,COST_AUTO=.85;
S.pg.oc={win:7,up:10};
P.contain={title:'Overall Containment',sub:'Dashboards · IVR, chat bot and AI employees together',filters:'range',body(){
  const ctl=`<div class="card tight"><div class="g g2" style="gap:24px"><div><label class="l">Count a contact as a repeat if the customer returns within</label>${slider('ocwin',{min:3,max:30,val:S.pg.oc.win,fmt:v=>v+' days',label:'Repeat window'})}<div class="xs muted mt">Open decision #3. Containment is only worth counting if the issue stays solved.</div></div><div class="muted sm" style="align-self:center">Containment counts sessions that ended without a person. <b>True containment</b> removes the ones that came back, so it is the number to trust.</div></div></div>`;
  const main=R('ocmain',()=>{
    const f=repF(S.pg.oc.win),k=RF[S.f.range],rows=AUTO.map(a=>{const n=a.n*k,c=n*a.c/100,t=c*(1-a.rep*f/100);return{...a,n,c:c,t,tr:t/n*100}});
    const N=sum(rows.map(r=>r.n)),C=sum(rows.map(r=>r.c)),T=sum(rows.map(r=>r.t)),saved=C*(COST_AGENT-COST_AUTO);
    const s=series('M44',30),tf=1-avg(rows.map(r=>AUTO.find(a=>a.k===r.k).rep))*f/100;
    return `<div class="g g4"><div class="tile ${status('M44')}" ${A('go','metric/M44')}><h5>${ragDot(status('M44'))} Overall containment (M44)</h5><div class="v">${f1(C/N*100)}%</div><div class="muted xs">target ${fmtT('M44')} · ${fmtN(C)} of ${fmtN(N)} sessions</div></div><div class="tile ${T/N*100>=28?'good':'warn'}"><h5>True containment</h5><div class="v">${f1(T/N*100)}%</div><div class="muted xs">no repeat within ${S.pg.oc.win} days · gap ${f1(C/N*100-T/N*100)} pts</div></div><div class="tile"><h5>Handed to a person</h5><div class="v">${fmtN(sum(rows.map(r=>r.n*r.ho/100)))}</div><div class="muted xs">${f1(sum(rows.map(r=>r.n*r.ho/100))/N*100)}% of sessions</div></div><div class="tile good"><h5>Cost avoided</h5><div class="v">$${fmtN(saved/1000)}k</div><div class="muted xs">at $${COST_AGENT.toFixed(2)} agent vs $${COST_AUTO.toFixed(2)} automated per session</div></div></div>
    <div class="g g2" style="margin-top:16px">${card('Containment vs. true containment',lineChart({labels:daysBack(30),h:270,xEvery:5,yMin:15,yMax:50,yFmt:v=>Math.round(v)+'%',series:[{name:'Containment',color:'#6B63D6',data:s},{name:'True containment',color:'#2EA06F',data:s.map(x=>x*tf),area:true}],target:{v:tgt('M44'),label:'Target '+tgt('M44')+'%'},act:'seg',actArg:i=>({title:daysBack(30)[i]+' · automated sessions',key:'oc'+i,n:10,opts:{agent:'AI Employee - Sofia'}})})+legend([{name:'Containment',color:'#6B63D6'},{name:'True containment',color:'#2EA06F'}]),{info:'M44 Self-service containment, with the repeat-contact adjustment from M42.'})}
    ${card('From session to resolution',funnel([{k:'Automated sessions',v:N,note:'IVR + bot + AI',color:'linear-gradient(90deg,#5B8BBF,#8EB4DA)'},{k:'Contained',v:C,note:f1(C/N*100)+'%',color:'linear-gradient(90deg,#6B63D6,#A59DE8)'},{k:'Stayed resolved',v:T,note:f1(T/N*100)+'% true',color:'linear-gradient(90deg,#2EA06F,#8FD3B4)'}]))}</div>
    ${card('By automation type',table([{h:'Channel'},{h:'Sessions',cls:'r'},{h:'Containment',cls:'r'},{h:'Repeat in '+S.pg.oc.win+'d',cls:'r'},{h:'True containment',cls:'r'},{h:'Handoff',cls:'r'},{h:'CSAT',cls:'r'}],rows.map(r=>`<tr class="rc" ${A(r.k==='AI employees'?'go':'seg',r.k==='AI employees'?'aicontain':{title:r.k+' sessions',key:'oct'+r.k,n:10,sub:'Sample of sessions'})}><td><span class="dot" style="background:${r.col};margin-right:8px"></span><b>${r.k}</b></td><td class="r">${fmtN(r.n)}</td><td class="r b">${r.c/r.n*100>=35?'':''}${f1(r.c/r.n*100)}%</td><td class="r muted">${f1(r.rep*f)}%</td><td class="r b" style="color:#17714F">${f1(r.tr)}%</td><td class="r">${r.ho}%</td><td class="r">${r.csat.toFixed(1)}</td></tr>`)),{cls:'flat',right:`<button class="btn sm" ${A('go','aicontain')}>AI containment report</button>`})}`;
  });
  const opp=card('Where to automate next',`<div class="row wrap" style="margin:-4px 0 10px"><span class="muted sm">If containment rose by</span><div style="width:200px">${slider('ocup',{min:2,max:25,val:S.pg.oc.up,fmt:v=>'+'+v+' pts',label:'Uplift'})}</div></div>`+R('ocopp',()=>{
    const rows=INTENTS_ALL.map(r=>({k:r[0],n:r[1],c:r[2],sv:r[1]*S.pg.oc.up/100*(COST_AGENT-COST_AUTO)})).sort((a,b)=>b.sv-a.sv),tot=sum(rows.map(r=>r.sv));
    return `<div class="note good" style="margin-bottom:10px">${ico('spark','sm')}<div>A <b>+${S.pg.oc.up} point</b> gain across every intent avoids about <b>$${fmtN(tot/1000)}k</b> a month. The biggest prizes are listed first.</div></div>`+table([{h:'Intent'},{h:'Sessions',cls:'r'},{h:'Containment',cls:'r'},{h:'',style:''},{h:'Monthly saving',cls:'r'}],rows.map(r=>`<tr class="rc" ${A('seg',{title:r.k+' · automated sessions',key:'int'+r.k,n:10,sub:'Containment '+r.c+'%'})}><td class="b">${r.k}</td><td class="r">${fmtN(r.n)}</td><td class="r">${r.c}%</td><td style="width:140px">${pbar(r.c,r.c>=35?'good':r.c>=25?'warn':'bad')}</td><td class="r b">$${fmtN(r.sv)}</td></tr>`))}),{info:'Volume × uplift × (agent cost − automation cost). Cost per contact is a finance-approved allocation (decision #11).'});
  const why=card('Why sessions were handed to a person',hbars([['Customer asked for a person',31],['Intent not recognised',24],['Authentication failed',14],['Policy exception needed',12],['Negative sentiment detected',11],['Other',8]].map(x=>({k:x[0],v:x[1],color:'#6B63D6',act:'seg',arg:{title:x[0]+' · handoffs',key:'ho'+x[0],n:10}})),{max:40,fmt:v=>v+'%'}));
  return ctl+main+`<div class="g g21">${opp}${why}</div>`+proposedCard(PROP_AI.slice(1,2).concat(PROP_AI.slice(3)),'Proposed metrics for containment');
}};

ACT.ocup=(v,el)=>{S.pg.oc.up=+v;sliderLabel(el,'+'+v+' pts');refresh('ocopp')};

S.pg.ac={thr:60,done:{}};
const AI_INT=[['Order status',1280,42],['Billing question',910,23],['Hail claim status',640,20],['Reconnect equipment',420,54],['Refund request',380,15],['Product features',312,64]];
const AI_FIX=[['Add an adjuster ETA answer for “Hail claim status”','31% of uncontained claim conversations ask when the adjuster will respond. A knowledge article and one integration lookup would answer it.','+2.1 pts','≈ 83 conversations a month'],['Lower the confidence handoff for “Refund request”','The AI hands off at 61% confidence even when its answer is correct 82% of the time on this intent.','+1.4 pts','≈ 55 a month'],['Fix identity verification timeouts','Authentication fails on 12% of voice sessions because of a 5-second timeout. Extend it to 8 seconds.','+0.9 pts','≈ 35 a month'],['Pass the transcript on handoff','12% of handoffs make the customer repeat themselves. Sending intent and summary to the agent protects CSAT.','+0.2 CSAT','≈ 130 handoffs a month']];
P.aicontain={title:'AI Containment',sub:'Dashboards · AI employees only',filters:'range',body(){
  const ctl=card('Handoff confidence',`<div class="row wrap"><span class="muted sm">Hand off to a person when the AI’s confidence is below</span><div style="width:260px">${slider('acthr',{min:40,max:90,val:S.pg.ac.thr,fmt:v=>v+'%',label:'Handoff confidence threshold'})}</div><span class="muted xs">What-if only. Raising it contains less but protects CSAT and cuts false containment.</span></div>`);
  const main=R('acmain',()=>{
    const t=S.pg.ac.thr,d=t-60,k=RF[S.f.range],n=3942*k,cont=34.5-d*.35,ho=28+d*.30,cb=12,ab=100-cont-ho-cb,csat=4.3+d*.012,rep=14-d*.25;
    return `<div class="g g5"><div class="tile ${cont>=35?'good':'warn'}" ${A('go','metric/M44')}><h5>${ragDot(cont>=35?'good':'warn')} AI containment</h5><div class="v">${f1(cont)}%</div><div class="muted xs">target 35%</div></div><div class="tile"><h5>AI conversations</h5><div class="v">${fmtN(n)}</div><div class="muted xs">+11% vs. last period</div></div><div class="tile"><h5>Handed to a person</h5><div class="v">${f1(ho)}%</div></div><div class="tile ${rep<=15?'good':'warn'}"><h5>Repeat within 7 days</h5><div class="v">${f1(rep)}%</div><div class="muted xs">false containment</div></div><div class="tile"><h5>AI CSAT</h5><div class="v">${csat.toFixed(2)}</div><div class="muted xs">human agents 4.1</div></div></div>
    <div class="g g21" style="margin-top:16px">${card('Containment by intent',hbars(AI_INT.map(i=>({k:i[0],v:Math.max(2,i[2]-d*.35),color:i[2]>=35?'#6B63D6':i[2]>=25?'#F1BE4A':'#EA6C8B',tip:`<b>${i[0]}</b><br>${fmtN(i[1]*k)} conversations`,act:'seg',arg:{title:i[0]+' · AI conversations',key:'aci'+i[0],n:10,opts:{agent:'AI Employee - Sofia'}}})),{max:100,target:35,fmt:v=>f1(v,0)+'%'})+`<div class="xs muted mt">Dark marker is the 35% target. Click an intent for sample conversations.</div>`)}
    ${card('Outcomes',donut([{k:'Contained',v:cont,color:'#6B63D6'},{k:'Handed to a person',v:ho,color:'#E8967A'},{k:'Callback',v:cb,color:'#68BFBF'},{k:'Abandoned',v:ab,color:'#C9C5BC'}],{size:190,center:f1(cont)+'%',sub:'contained',fmt:v=>f1(v)+'%'})+legend([{name:'Contained',color:'#6B63D6'},{name:'Handoff',color:'#E8967A'},{name:'Callback',color:'#68BFBF'},{name:'Abandoned',color:'#C9C5BC'}]))}</div>`;
  });
  const emp=card('By AI employee',table([{h:'AI employee'},{h:'Channel'},{h:'Conversations',cls:'r'},{h:'Containment',cls:'r'},{h:'Handoff',cls:'r'},{h:'Handoff with context',cls:'r'},{h:'Avg handle',cls:'r'},{h:'CSAT',cls:'r'}],AIEMP.map((a,i)=>`<tr class="rc" ${A('seg',{title:a.name,key:'ace'+a.name,n:10,opts:{agent:a.name}})}><td><div class="who">${avatar(a.name,a.col)}${esc(a.name)}</div></td><td>${chanCell(i?'Call':'Messenger')}</td><td class="r">${fmtN((2100-i*260)*RF[S.f.range])}</td><td class="r b">${[37.2,31.4][i]}%</td><td class="r">${[26,31][i]}%</td><td class="r">${[91,84][i]}%</td><td class="r">${dur([154,189][i])}</td><td class="r">${[4.4,4.2][i]}</td></tr>`)),{cls:'flat'});
  const tr=card('Weekly AI containment',lineChart({labels:WK,h:240,yMin:20,yMax:45,yFmt:v=>Math.round(v)+'%',series:[{name:'AI containment',color:'#6B63D6',data:[29.8,30.4,31.1,31.9,32.0,32.8,33.1,33.4,33.9,34.0,34.3,34.5],area:true}],target:{v:35,label:'Target 35%'}}));

const SUPCOL=[['rate','Per 100 contacts','',0,1],['tti','Time to intervene','s',-1,0],['save','Save rate','%',1,0],['lift','Sentiment lift','pts',1,0],['aht','Handle-time impact','s',-1,0],['csat','CSAT after','%',1,0],['coach','Coaching follow-up','%',1,0]];
function supM(s,t){const f=TFX[t];return{...s,lift:s.lift*f.l,aht:s.aht*f.a,save:clamp(s.save+f.s,40,99),cnt:Math.round(s.cnt*f.n)}}
function supStats(){
  const t=S.pg.iv.type,min=S.pg.iv.min,all=SUPS.map(s=>supM(s,t)).map(s=>({...s,ok:s.cnt>=min*TFX[t].n}));
  const ok=all.filter(s=>s.ok),z={},med=k=>{const v=ok.map(s=>s[k]).sort((a,b)=>a-b);return v.length?v[Math.floor((v.length-1)/2)]+(v.length%2?0:(v[v.length/2]-v[v.length/2-1])/2*0):0};
  const mean=k=>avg(ok.map(s=>s[k])),sd=k=>Math.sqrt(avg(ok.map(s=>(s[k]-mean(k))**2)))||1;
  all.forEach(s=>{s.score=Math.round(clamp(50+15*avg(SUPCOL.filter(c=>c[3]!==0).map(c=>c[3]*(s[c[0]]-mean(c[0]))/sd(c[0]))),5,98))});
  return{all,ok,med,rank:[...ok].sort((a,b)=>b.score-a.score)}}

function shell(){
  $('#app').innerHTML=`<nav class="rail" aria-label="Primary"><svg class="logo" viewBox="0 0 32 32" aria-label="Nextiva"><path d="M7 6c5 0 6.5 4 9 8 2.5 4 4 8 9 8M25 6c-5 0-6.5 4-9 8-2.5 4-4 8-9 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></svg>${RAIL.map(r=>r==='sp'?'<span class="sp"></span>':`<a ${A('rail',r[0]+'|'+(r[2]||''))} class="${r[4]?'on':''}" tabindex="0" role="button" aria-label="${r[1]}">${r[0]==='hand'?'<span style="font-size:19px;line-height:20px">👋</span>':ico(r[0])}${r[3]?`<span class="bdg">${r[3]}</span>`:''}<span>${r[1]}</span></a>`).join('')}</nav>
  <div class="right"><header class="top"><button class="ib hamb" ${A('side')} aria-label="Menu">${ico('menu')}</button><div class="srch">${ico('search','sm')}<input id="gs" type="text" ${IN('gsq')} placeholder="Search anything…" autocomplete="off" aria-label="Search anything"><kbd>⌘K</kbd></div><span class="sp"></span><button class="btn-nq" id="btnnq" ${A('nq_open')}>${ico('spark','sm')} Ask NextIQ</button><button class="tbtn" ${A('go','calllog')} aria-label="Calls">${ico('phone','sm')}</button><span class="tbtn" ${A('toast','Chat is not part of this prototype')} role="button" aria-label="Chat">${ico('chat','sm')}${ico('chev','xs')}</span><button class="tbtn" id="bell" ${A('bell')} aria-label="Notifications">${ico('bell','sm')}<span class="bdg" id="bellb">5</span></button><span class="avatar" ${TIP('Signed in as a supervisor')}>JM</span></header>
  <div class="body"><aside class="side" id="side"><h1>Analytics</h1><div class="lens"><label for="lens">Viewing as</label><select id="lens" ${IN('lens')} data-ch="lens">${PERSONAS.map(p=>`<option value="${p}">${p==='Leadership'?'Leader':p}</option>`).join('')}</select></div><nav class="nav" id="nav" aria-label="Analytics">${NAV.map(navSec).join('')}</nav><div class="arch" ${A('toast','Archived reports open here')}>${ico('archive','sm')} Archived</div></aside><main id="main" tabindex="-1"></main></div></div>`;
}
function navSec(s){
  if(s.route)return `<div class="nsec"><div class="nh" ${A('go',s.route)} data-r="${s.route}" role="link" tabindex="0">${ico(s.icon,'sm')}${s.title}</div></div>`;
  const shut=S.nav.shut[s.id]??!s.open;
  return `<div class="nsec ${shut?'shut':''}" id="ns-${s.id}" data-lens="${s.lens||''}"><div class="nh" ${A('navtog',s.id)} role="button" tabindex="0" aria-expanded="${!shut}">${ico(s.icon,'sm')}${s.title}${s.plus?`<span class="plus" ${A('go',s.plus)} role="button" aria-label="Create new" title="Create new">${ico('plus','xs')}</span>`:`<span class="car">${ico('chev','xs')}</span>`}</div><div class="nitems">${s.items.map(i=>`<div class="ni" ${A('go',i[0])} data-r="${i[0]}" role="link" tabindex="0">${i[1]}${i[2]?'<span class="new">New</span>':''}</div>`).join('')}</div></div>`;
}
ACT.navtog=id=>{const el=$('#ns-'+id);const shut=!el.classList.contains('shut');el.classList.toggle('shut',shut);S.nav.shut[id]=shut};
ACT.go=(a,el,e)=>{if(e&&e.target.closest('.plus')&&el.classList.contains('nh'))return;closeDrawer();closeMenu();$('#side').classList.remove('open');go(a)};
ACT.side=()=>$('#side').classList.toggle('open');
ACT.rail=a=>{const[k,r]=a.split('|');if(k==='spark')return ACT.nq_open();if(r)return go(r);toast('This area is not part of the analytics prototype')};
function updateNav(){
  const{name,args}=route(),key=name==='builder'&&args[0]==='built'?'builder':name;
  $$('#nav .ni').forEach(n=>n.classList.toggle('on',n.dataset.r===key));
  const on=$('#nav .ni.on');if(on){const sec=on.closest('.nsec');if(sec&&sec.classList.contains('shut')){sec.classList.remove('shut');S.nav.shut[sec.id.slice(3)]=false}}
  $$('#nav .nh[data-r]').forEach(n=>n.classList.toggle('on',n.dataset.r===key));
}
function updateLens(){
  const sel=$('#lens');if(sel)sel.value=S.persona;
  $$('#nav .nsec[data-lens]').forEach(s=>{const l=s.dataset.lens;if(!l)return;const is=l===S.persona;s.classList.toggle('lensOn',is);if(is)s.classList.remove('shut');else if(PERSONAS.includes(l))s.classList.add('shut')});
  const sup=$('#ns-sup');if(S.persona!=='Supervisor'&&sup)sup.classList.add('shut');
}
ACT.lens=v=>{S.persona=v;S.nq.persona=v;updateLens();if(S.nq.open)nqPaint();const first={Agent:'myperf',Supervisor:'wallboard',QA:'evalops',WFM:'forecast',Leadership:'exec'}[v];toast(`Viewing as ${v==='Leadership'?'Leader':v}`);go(first)};
/* bell */
function updateBell(){const n=S.notes.filter(x=>x.unread).length,b=$('#bellb');if(!b)return;b.textContent=n;b.style.display=n?'':'none'}
ACT.bell=(a,el)=>{
  const had=$('#menu');closeMenu();if(had&&had.dataset.k==='bell')return;
  const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='menu';d.id='menu';d.dataset.k='bell';d.style.width='360px';
  d.innerHTML=`<div class="row" style="padding:8px 10px"><b class="sp1">Notifications</b><button class="btn sm ghost" ${A('bellread')}>Mark all read</button></div>`+(S.notes.length?S.notes.slice(0,8).map((n,i)=>`<button ${A('bellgo',n.id)} style="align-items:flex-start;gap:10px"><span class="dot" style="background:${PCOL[n.p]};margin-top:6px"></span><span class="sp1"><span style="display:block;font-weight:${n.unread?600:400}">${esc(n.t)}</span><span class="muted xs">${n.p} · ${n.ago}${n.ago==='now'?'':' ago'}</span></span></button>`).join(''):'<div class="empty">You’re all caught up.</div>')+`<div style="padding:6px 8px"><button class="btn sm" ${A('go','alerts')} style="width:100%;justify-content:center">Manage alerts</button></div>`;
  document.body.appendChild(d);d.style.left=Math.max(10,Math.min(innerWidth-370,r.right-360))+'px';d.style.top=(r.bottom+8)+'px';
};
ACT.bellread=()=>{S.notes.forEach(n=>n.unread=false);updateBell();closeMenu();toast('All notifications marked read')};
ACT.bellgo=id=>{const n=S.notes.find(x=>x.id==id);if(n){n.unread=false;updateBell();closeMenu();go(n.go)}};
/* global search */
const SEARCH=()=>{const pages=NAV.flatMap(s=>s.route?[[s.route,s.title,'Page']]:s.items.map(i=>[i[0],i[1],s.title]));return{pages}};
ACT.gsq=v=>{
  closeMenu();v=v.trim().toLowerCase();if(!v)return;
  const res=[],{pages}=SEARCH();
  pages.filter(p=>p[1].toLowerCase().includes(v)).slice(0,4).forEach(p=>res.push(['go',p[0],p[1],p[2]]));
  DATA.metrics.filter(m=>(m.name+' '+m.id).toLowerCase().includes(v)).slice(0,4).forEach(m=>res.push(['go','metric/'+m.id,m.name,'Metric '+m.id]));
  AG.filter(a=>a.name.toLowerCase().includes(v)).slice(0,3).forEach(a=>res.push(['go','agent/'+a.id,a.name,'Agent · '+a.team]));
  Object.keys(TIX).filter(t=>t.toLowerCase().includes(v)).slice(0,2).forEach(t=>res.push(['ticket',t,t,'Interaction']));
  const el=$('#gs'),r=el.getBoundingClientRect(),d=document.createElement('div');d.className='menu';d.id='menu';d.dataset.k='gs';d.style.width='360px';
  d.innerHTML=res.length?res.slice(0,9).map(x=>`<button ${A(x[0],x[1])}><span class="sp1"><span style="display:block">${esc(x[2])}</span><span class="muted xs">${esc(x[3])}</span></span></button>`).join('')+`<button ${A('nq_ask',el.value)}>${ico('spark','sm')}<span class="sp1">Ask NextIQ: “${esc(el.value)}”</span></button>`:`<div class="empty" style="padding:16px">No matches. <a href="#" ${A('nq_ask',el.value)}>Ask NextIQ</a></div>`;
  document.body.appendChild(d);d.style.left=r.left+'px';d.style.top=(r.bottom+6)+'px';
};
ACT.mbg=(a,el,e)=>{if(e.target===el)closeModal()};
/* live ticking */
setInterval(()=>{const s=Math.floor((Date.now()-T0)/1000);$$('[data-ts]').forEach(el=>{el.textContent=dur(+el.dataset.ts+s,true)})},1000);
/* boot */
function boot(){
  shell();updateBell();render(false);updateLens();updateNav();initRanges();
  if(!location.hash)history.replaceState(null,'','#/livedash');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

</script><script>
/* Live overlay: replaces a few sample numbers with real BigQuery values from data.json */
(function(){
  fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d||!d.kpis||d.error)return;
    var k=d.kpis;
    function set(id,v){if(v==null||!isFinite(v)||!VALS[id])return;VALS[id][0]=+v;VALS[id][2]=+v}
    set('M01',k.workitems);set('M02',k.connected);set('M03',k.abandoned_calls);
    set('M04',k.aht_mean_sec_capped);set('M05',k.talk_avg_sec);set('M06',k.hold_avg_sec);set('M07',k.acw_avg_sec_capped);
    if(k.workitems)set('M10',k.abandoned_calls/k.workitems*100);
    if(k.connected)set('M38',k.transferred_calls/k.connected*100);
    var cov=(d.coverage||[]),c=cov.reduce(function(a,x){return a+x.connected_calls},0),s=cov.reduce(function(a,x){return a+x.with_summary},0);
    var b=document.createElement('div');
    b.style.cssText='position:fixed;left:72px;bottom:12px;z-index:90;background:#1F1F1F;color:#fff;font:12px/1.4 sans-serif;padding:8px 12px;border-radius:10px;max-width:420px;opacity:.92';
    b.innerHTML='<b>Live from BigQuery</b> · updated '+new Date(d.updated_at).toLocaleString()+'<br>Voice volume, AHT, talk, hold, wrap-up, abandon and transfer are real (last '+d.window_days+' days). Summary coverage: '+s+' of '+c+' connected calls. Everything else is sample data.';
    document.body.appendChild(b);
    render(true);
  }).catch(function(){});
})();
</script>
</body></html>
